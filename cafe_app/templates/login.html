<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mocha Moments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background-color:#f8f1e7;
        }

        .navbar{
            background-color:#4e342e;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:20px;
            font-size:18px;
        }

        .login-section{
            background: linear-gradient(rgba(0,0,0,0.5),
                        rgba(0,0,0,0.5)),
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4');

            background-size: cover;
            background-position: center;
            min-height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{
            background-color:rgba(255,255,255,0.95);
            width:420px;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px black;
        }

        .login-box h3{
            text-align:center;
            color:#4e342e;
            margin-bottom:25px;
            font-weight:bold;
        }

        .form-control{
            margin-bottom:20px;
            height:45px;
        }

        .btn-cafe{
            background-color:#6d4c41;
            color:white;
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            font-size:18px;
        }

        .btn-cafe:hover{
            background-color:#3e2723;
        }

        footer{
            background-color:#4e342e;
            color:white;
            padding:30px;
            text-align:center;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="/">
            ☕ Mocha Moments
        </a>

        <div>
            <a class="nav-link d-inline" href="/">Home</a>
            <a class="nav-link d-inline" href="/login/">Login</a>
            <a class="nav-link d-inline" href="/register/">Register</a>
            <a class="nav-link d-inline" href="/about/">About</a>

        </div>

    </div>
</nav>

<!-- Login Section -->
<div class="login-section">

    <div class="login-box">

        <h3>Enjoy every sip & bite 🍰</h3>
{% if messages %}

    {% for message in messages %}

        <div class="alert alert-{{ message.tags }} text-center">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}
        <form method="POST">
            {% csrf_token %}

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username">

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password">

            <button type="submit" class="btn-cafe">
                Login
            </button>
        </form>

        <div class="text-center mt-3">
            <p>New User?</p>
            <a href="/register/" class="btn btn-outline-dark">
                Register Here
            </a>
        </div>

    </div>

</div>

<footer>
    <h3>☕ Mocha Moments</h3>
    <p>Brewing Happiness One Cup at a Time</p>
    <p>📍 Kochi, Kerala</p>
    <p>© 2026 Mocha Moments</p>
</footer>

</body>
</html>
