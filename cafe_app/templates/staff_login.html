<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login - Mocha Moments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background-color:#f8f1e7;
        }

        .navbar{
            background-color:#2c1810;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .login-section{

            min-height:90vh;

            background:linear-gradient(
                    rgba(0,0,0,0.5),
                    rgba(0,0,0,0.5)
            ),

            url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085');

            background-size:cover;
            background-position:center;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-box{

            background-color:rgba(255,255,255,0.95);

            width:450px;

            padding:40px;

            border-radius:15px;

            box-shadow:0px 0px 20px black;
        }

        .login-box h2{

            text-align:center;

            color:#4e342e;

            margin-bottom:10px;

            font-weight:bold;
        }

        .login-box p{

            text-align:center;

            color:gray;

            margin-bottom:25px;
        }

        .form-control{

            margin-bottom:20px;

            height:50px;
        }

        .btn-login{

            width:100%;

            background-color:#6f4e37;

            color:white;

            border:none;

            padding:12px;

            border-radius:8px;

            font-size:18px;
        }

        .btn-login:hover{

            background-color:#4e342e;
        }

        footer{

            background-color:#2c1810;

            color:white;

            text-align:center;

            padding:25px;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="/">
            ☕ Mocha Moments
        </a>

    </div>

</nav>

<!-- Login Section -->

<div class="login-section">

    <div class="login-box">

        <h2>
            Staff Login 👨‍🍳
        </h2>

        <p>
            Access the Staff Dashboard
        </p>

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger text-center">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter Password"
                   required>

            <button type="submit"
                    class="btn-login">

                Login

            </button>

        </form>

    </div>

</div>

<!-- Footer -->

<footer>

    <h3>
        ☕ Mocha Moments
    </h3>

    <p>
        Staff Management Portal
    </p>

    <p>
        © 2026 Mocha Moments. All Rights Reserved.
    </p>

</footer>

</body>

</html>
