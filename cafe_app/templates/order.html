<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Mocha Moments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f8f1e7;
            font-family:Arial, sans-serif;
        }

        .navbar{
            background-color:#2c1810;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:20px;
            font-size:18px;
        }

        .order-section{
            min-height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .order-box{
            background-color:white;
            width:500px;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        .order-box h2{
            text-align:center;
            color:#4e342e;
            margin-bottom:30px;
        }

        .form-control,
        .form-select{
            margin-bottom:20px;
            height:45px;
        }

        textarea{
            margin-bottom:20px;
        }

        .btn-order{
            width:100%;
            background-color:#6f4e37;
            color:white;
            border:none;
            padding:12px;
            border-radius:8px;
            font-size:18px;
        }

        .btn-order:hover{
            background-color:#4e342e;
        }

        footer{
            background-color:#2c1810;
            color:white;
            text-align:center;
            padding:30px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/">☕ Mocha Moments</a>

        <div>
            <a class="nav-link d-inline" href="/user_home/">Home</a>
            <a class="nav-link d-inline" href="/logout/">Logout</a>
        </div>
    </div>
</nav>

<!-- ORDER FORM -->
<div class="order-section">

    <div class="order-box">

        <h2>Place Your Order ☕</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- ITEM -->
            <label>Item Name</label>
            <input type="text" name="item_name" class="form-control" value="{{ item }}" readonly>

            <!-- QUANTITY -->
            <label>Quantity</label>
            <input type="number" name="quantity" class="form-control" required>

            <!-- DELIVERY OPTION -->
            <label>Delivery Option</label>
            <select name="delivery_option" class="form-select" id="deliveryOption" onchange="toggleFields()" required>
                <option value="">Select Option</option>
                <option value="Delivery">Delivery</option>
                <option value="Pickup">Pickup</option>
            </select>

            <!-- ADDRESS (ONLY DELIVERY) -->
            <div id="addressField" style="display:none;">
                <label>Delivery Address</label>
                <textarea name="address" class="form-control" rows="3"></textarea>
            </div>

            <!-- PICKUP (ONLY PICKUP) -->
            <div id="pickupField" style="display:none;">

                <label>Pickup Time</label>
                <input type="time" name="pickup_time" class="form-control">

                <label>AM / PM</label>
                <select name="pickup_period" class="form-select">
                    <option value="">Select</option>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>

            </div>

            <!-- PAYMENT -->
            <label>Payment Method</label>
            <select name="payment_method" class="form-select" required>
                <option value="">Select Payment</option>
                <option value="UPI">UPI</option>
                <option value="GPAY">Google Pay</option>
                <option value="CASH">Cash on Delivery</option>
            </select>

            <button type="submit" class="btn-order">
                Confirm Order
            </button>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer>
    <h3>☕ Mocha Moments</h3>
    <p>Brewing Happiness One Cup at a Time</p>
    <p>© 2026 Mocha Moments</p>
</footer>

<!-- JS -->
<script>
function toggleFields() {

    let option = document.getElementById("deliveryOption").value;

    let address = document.getElementById("addressField");
    let pickup = document.getElementById("pickupField");

    // reset
    address.style.display = "none";
    pickup.style.display = "none";

    if(option === "Delivery"){
        address.style.display = "block";
    }

    if(option === "Pickup"){
        pickup.style.display = "block";
    }
}


setTimeout(function () {

    let msg = document.getElementById("messageBox");

    if (msg) {
        msg.style.transition = "0.5s";
        msg.style.opacity = "0";
        setTimeout(() => msg.remove(), 500);
    }

}, 3000); // 3 seconds





</script>

</body>
</html>
