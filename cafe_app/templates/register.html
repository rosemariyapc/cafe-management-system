<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Mocha Moments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background-color:#f8f1e7;
        }

        /* Navbar */
        .navbar{
            background-color:#4e342e;
            padding:15px;
        }

        .navbar-brand{
            color:white !important;
            font-size:30px;
            font-weight:bold;
        }

        .nav-link{
            color:white !important;
            margin-left:20px;
            font-size:18px;
        }

        /* Register Section */
        .register-section{
            min-height:85vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            background-color:rgba(255,255,255,0.95);
            width:420px;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 15px black;
        }

        .register-box h3{
            text-align:center;
            color:#4e342e;
            margin-bottom:25px;
            font-weight:bold;
        }

        .form-control{
            margin-bottom:20px;
            height:45px;
        }

        .btn-cafe{
            background-color:#6d4c41;
            color:white;
            width:100%;
            padding:10px;
            border:none;
            border-radius:8px;
            font-size:18px;
        }

        .btn-cafe:hover{
            background-color:#3e2723;
        }

        /* Footer */
        footer{
            background-color:#4e342e;
            color:white;
            padding:30px;
            text-align:center;
        }

    </style>

</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand" href="/">
            ☕ Mocha Moments
        </a>

        <div>
            <a class="nav-link d-inline" href="/">Home</a>
            <a class="nav-link d-inline" href="/login/">Login</a>
            <a class="nav-link d-inline" href="/register/">Register</a>
            <a class="nav-link d-inline" href="/about/">About</a>

        </div>

    </div>
</nav><br>

<!-- Register Section -->
<div class="register-section">

    <div class="register-box">

        <h3>Create Your Account ☕</h3>

        <form method="POST">
            {% csrf_token %}

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Username">

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Email">

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Password">

            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm Password">

            <button type="submit" class="btn-cafe">
                Register
            </button>

        </form>

        <div class="text-center mt-3">
            <p>Already registered?</p>
            <a href="/login/" class="btn btn-outline-dark">
                Login here
            </a>
        </div>

    </div>

</div><br>

<!-- Footer -->
<footer>

    <h3>☕ Mocha Moments</h3>

    <p>Brewing Happiness One Cup at a Time</p>

    <p>📞 Contact: +91 9876543210</p>

    <p>📍 Kochi, Kerala</p>

    <hr style="background-color:white;">

    <p>© 2026 Mocha Moments. All Rights Reserved.</p>

</footer>

</body>
</html>
